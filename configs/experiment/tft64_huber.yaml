# Job 3: Huber-only TFT-64

teacher:
  loss: "huber"
  huber_delta: 1.0
  hidden_size: 64
  hidden_continuous_size: 8
  lstm_layers: 1
  attention_heads: 4
  dropout: 0.1
  lr: 0.001
  batch_size: 256
  epochs: 20
  scheduler_patience: 2
  early_stopping_patience: 8
  save_top_k: 5
  checkpoint_filename: "tft64-huber-epoch={epoch:02d}-val_loss={val_loss:.6f}"
  gradient_clip_val: 0.1
