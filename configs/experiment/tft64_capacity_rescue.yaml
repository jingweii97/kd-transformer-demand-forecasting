# Pre-specified capacity-rescue TFT-64.
# This tests richer continuous-variable representations and a deeper temporal
# pathway while preserving the successful Huber objective and all other
# baseline TFT-64 settings.

teacher:
  loss: "huber"
  huber_delta: 1.0
  hidden_size: 64
  hidden_continuous_size: 16
  lstm_layers: 2
  attention_heads: 4
  dropout: 0.1
  lr: 0.001
  batch_size: 256
  epochs: 20
  scheduler_patience: 2
  early_stopping_patience: 8
  save_top_k: 5
  checkpoint_filename: "tft64-capacity-rescue-epoch={epoch:02d}-val_loss={val_loss:.6f}"
  # Explicit for reproducibility. train_teacher.py gives this experiment-level
  # setting precedence over the shared environment default.
  gradient_clip_val: 0.1
