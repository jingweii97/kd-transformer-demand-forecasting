# Definitive v2 teacher: original WI-TFT objective/settings with phase-balanced
# explicit forecast origins shared by Teacher-v2, WIS-v2, and WIKD-v2.
store_filter: ""

dataset:
  training_origin_sampling:
    mode: "explicit_list"
    origins_file: "configs/origins/phase_balanced_v2.json"
  validation_origin_sampling:
    mode: "explicit_list"
    origins_file: "configs/origins/phase_balanced_validation_v2.json"

teacher:
  loss: "wrmsse_informed"
  output_size: 1
  hidden_size: 64
  hidden_continuous_size: 8
  lstm_layers: 1
  attention_heads: 4
  dropout: 0.1
  lr: 0.001
  batch_size: 256
  epochs: 20
  scheduler_patience: 2
  early_stopping_patience: 8
  enable_early_stopping: false
  save_top_k: -1
  checkpoint_filename: "phase-teacher-v2-epoch={epoch:02d}-val_loss={val_loss:.6f}"
  gradient_clip_val: 0.1
  wrmsse_weight_days: 28
  wrmsse_scale_floor_quantile: 0.01
  wrmsse_epsilon: 1.0e-8
  pretraining_audit_approved: true
